server {
    listen 80;
    server_name localhost;
    underscores_in_headers on;

    # Cabeçalhos de Segurança HTTP (OWASP Hardening)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Content Security Policy (compatível com Vite SPA, Supabase e PWA)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://openrouter.ai https://api.openrouter.ai https://generativelanguage.googleapis.com https://sandbox.asaas.com https://api.asaas.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # NUNCA cachear arquivos de verificação de versão, HTML e manifesto
    location ~* ^/(index\.html|version\.json|manifest\.json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
    }

    # Proxy reverso same-origin para API do Asaas (evita CORS quando Edge Function não está publicada)
    location ^~ /api/asaas-sandbox/ {
        proxy_pass https://sandbox.asaas.com/api/v3/;
        proxy_ssl_server_name on;
        proxy_set_header Host sandbox.asaas.com;
        proxy_set_header access_token $http_x_asaas_access_token;
        proxy_set_header X-Asaas-Access-Token "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ^~ /api/asaas-prod/ {
        proxy_pass https://api.asaas.com/v3/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.asaas.com;
        proxy_set_header access_token $http_x_asaas_access_token;
        proxy_set_header X-Asaas-Access-Token "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache de 30 dias apenas para assets estáticos com hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Repetição de headers essenciais para sobrepor a anulação por location do Nginx
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
